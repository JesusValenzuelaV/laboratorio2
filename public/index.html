<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supermercado Básico - Inicio</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; box-sizing: border-box; }
        header { background-color: #2e7d32; color: white; padding: 1rem; text-align: center; }
        nav { background-color: #388e3c; padding: 0.5rem; text-align: center; }
        nav a { color: white; margin: 0 1rem; text-decoration: none; font-weight: bold; }
        .container { padding: 2rem; max-width: 1200px; margin: auto; }
        .products { display: flex; gap: 1rem; flex-wrap: wrap; justify-content: center; }
        .card { border: 1px solid #ddd; border-radius: 5px; padding: 1rem; width: 220px; text-align: center; }
        .card img { max-width: 100%; height: 150px; object-fit: cover; }
        .btn { background-color: #2e7d32; color: white; border: none; padding: 0.5rem 1rem; cursor: pointer; border-radius: 3px; }
        .btn:hover { background-color: #1b5e20; }
        footer { background-color: #333; color: white; text-align: center; padding: 1rem; margin-top: 2rem; }
    </style>
</head>
<body>

    <header>
        <h1>Supermercado Económico</h1>
        <p>Tu frescura y ahorro de todos los días</p>
    </header>

    <nav>
        <a href="#">Inicio</a>
        <a href="#">Frutas y Verduras</a>
        <a href="#">Lácteos</a>
        <a href="#">Abarrotes</a>
        <a href="#">Contacto</a>
    </nav>

    <div class="container">
        <h2>Productos Destacados</h2>
        <div class="products">
            <div class="card">
                <img src="https://placeholder.com" alt="Manzanas">
                <h3>Manzanas</h3>
                <p>$3.00 / kg</p>
                <button class="btn">Comprar</button>
            </div>
            <div class="card">
                <img src="https://placeholder.com" alt="Leche">
                <h3>Leche Entera</h3>
                <p>$1.20</p>
                <button class="btn">Comprar</button>
            </div>
            <div class="card">
                <img src="https://placeholder.com" alt="Arroz">
                <h3>Arroz (1 kg)</h3>
                <p>$1.80</p>
                <button class="btn">Comprar</button>
            </div>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Supermercado Económico. Todos los derechos reservados.</p>
    </footer>

</body>
</html>
